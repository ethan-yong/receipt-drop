<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#EDE4D3;font-family:'Baloo 2',sans-serif;}
  *{box-sizing:border-box;}
  a{color:#C4841C;} a:hover{color:#A66B12;}
  input{font-family:inherit;}
  input::placeholder{color:#B0A48D;}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;gap:16px;">

  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
    <div style="font-size:22px;font-weight:800;color:#2c2c33;letter-spacing:-.3px;">Confirm restaurant location</div>
    <div style="font-size:14px;font-weight:600;color:#8a8170;">Nearest matches within 500m, or search your own</div>
  </div>

  <div onClick="{{ replay }}" style="font-size:13px;font-weight:700;color:#C4841C;cursor:pointer;">Tap to replay the slide-up</div>

  <!-- ============ PHONE FRAME ============ -->
  <div style="position:relative;width:375px;height:760px;border-radius:44px;overflow:hidden;background:#FAF3E7;box-shadow:0 24px 60px rgba(60,40,20,.24);">

    <!-- ============ MAP BACKDROP ============ -->
    <div style="position:absolute;inset:0;background:#EFE9DA;">
      <svg width="100%" height="100%" viewBox="0 0 375 760" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;">
        <rect x="0" y="0" width="375" height="760" fill="#EFE9DA"></rect>
        <rect x="0" y="150" width="375" height="34" fill="#E3DCC8"></rect>
        <rect x="0" y="330" width="375" height="26" fill="#E3DCC8"></rect>
        <rect x="60" y="0" width="30" height="760" fill="#E3DCC8"></rect>
        <rect x="250" y="0" width="24" height="760" fill="#E3DCC8"></rect>
        <ellipse cx="187" cy="300" rx="150" ry="90" fill="#DCEBD4"></ellipse>
      </svg>

      <!-- 500m radius ring -->
      <div style="position:absolute;left:50%;top:300px;width:260px;height:260px;margin-left:-130px;margin-top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(245,194,66,.22) 0%,rgba(245,194,66,.06) 70%,rgba(245,194,66,0) 100%);border:1.5px dashed rgba(197,142,20,.35);"></div>

      <!-- you-are-here dot -->
      <div style="position:absolute;left:187px;top:300px;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#3B82D6;border:3px solid #fff;box-shadow:0 0 0 4px rgba(59,130,214,.25);"></div>

      <!-- location pins -->
      <div style="position:absolute;left:150px;top:255px;width:26px;height:26px;transform:translate(-50%,-100%);">
        <div style="width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:#F5C242;box-shadow:0 3px 8px rgba(60,40,20,.25);"></div>
      </div>
      <div style="position:absolute;left:230px;top:270px;width:22px;height:22px;transform:translate(-50%,-100%);">
        <div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:#C9BB9E;box-shadow:0 3px 8px rgba(60,40,20,.2);"></div>
      </div>
      <div style="position:absolute;left:120px;top:350px;width:22px;height:22px;transform:translate(-50%,-100%);">
        <div style="width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(45deg);background:#C9BB9E;box-shadow:0 3px 8px rgba(60,40,20,.2);"></div>
      </div>

      <!-- status bar -->
      <div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 24px 0;">
        <span style="font-size:15px;font-weight:700;color:#2c2c2c;">4:59</span>
        <span style="font-size:12px;font-weight:700;color:#2c2c2c;">47</span>
      </div>

      <!-- top bar -->
      <div style="position:absolute;top:52px;left:20px;right:20px;display:flex;align-items:center;gap:10px;">
        <div style="width:42px;height:42px;flex:none;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(60,40,20,.14);display:flex;align-items:center;justify-content:center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="#5A4632" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div onClick="{{ openSearch }}" style="flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:11px 16px;box-shadow:0 4px 12px rgba(60,40,20,.14);cursor:pointer;">
          <div style="width:9px;height:9px;flex:none;border-radius:50%;background:#3B82D6;"></div>
          <span style="font-size:14px;font-weight:600;color:#9C8A72;">Which restaurant was this?</span>
        </div>
      </div>
    </div>

    <!-- ============ SHEET ============ -->
    <div ref="{{ setSheet }}" style="position:absolute;left:0;right:0;bottom:0;background:#FFFDF8;border-radius:28px 28px 0 0;box-shadow:0 -18px 40px rgba(60,40,20,.16);padding:12px 22px 24px;transform:translateY({{ sheetOffset }}px);transition:transform .55s cubic-bezier(.22,.9,.32,1);">

      <div style="width:38px;height:5px;border-radius:3px;background:#E9DDC8;margin:0 auto 16px;"></div>

      <sc-if value="{{ searchOpen }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
          <div onClick="{{ closeSearch }}" style="width:34px;height:34px;flex:none;border-radius:50%;background:#F4E8D6;display:flex;align-items:center;justify-content:center;cursor:pointer;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="#5A4632" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
          <div style="flex:1;display:flex;align-items:center;gap:8px;background:#F4E8D6;border-radius:14px;padding:10px 14px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex:none;"><circle cx="11" cy="11" r="7" stroke="#9C8A72" stroke-width="2"></circle><path d="M21 21L16.65 16.65" stroke="#9C8A72" stroke-width="2" stroke-linecap="round"></path></svg>
            <input ref="{{ setSearchInput }}" value="{{ searchQuery }}" onChange="{{ onSearchChange }}" placeholder="Search for a restaurant or address" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:14px;font-weight:600;color:#4F2D23;"/>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ notSearchOpen }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <div style="display:flex;flex-direction:column;gap:2px;">
            <div style="font-size:18px;font-weight:800;color:#4F2D23;letter-spacing:-.2px;">Choose the location</div>
            <div style="font-size:13px;font-weight:600;color:#9C8A72;">3 spots found nearby</div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ notSearchOpen }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:10px;">
          <sc-for list="{{ spots }}" as="spot" hint-placeholder-count="3">
            <div onClick="{{ spot.select }}" style="cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:{{ spot.bg }};border:2px solid {{ spot.border }};transition:background .15s,border-color .15s;">
              <div style="width:38px;height:38px;flex:none;border-radius:12px;background:{{ spot.iconBg }};display:flex;align-items:center;justify-content:center;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 5 14.5 5 9.5C5 5.9 8.1 3 12 3C15.9 3 19 5.9 19 9.5C19 14.5 12 21 12 21Z" stroke="{{ spot.iconColor }}" stroke-width="2" stroke-linejoin="round"></path><circle cx="12" cy="9.5" r="2.4" fill="{{ spot.iconColor }}"></circle></svg>
              </div>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
                <div style="font-size:15px;font-weight:800;color:#4F2D23;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ spot.name }}</div>
                <div style="font-size:12.5px;font-weight:600;color:#9C8A72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ spot.address }}</div>
              </div>
              <div style="flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                <div style="font-size:12px;font-weight:700;color:{{ spot.distColor }};">{{ spot.distance }}</div>
                <div style="width:20px;height:20px;border-radius:50%;background:{{ spot.radioBg }};border:2px solid {{ spot.radioBorder }};display:flex;align-items:center;justify-content:center;">
                  <div style="width:8px;height:8px;border-radius:50%;background:#fff;opacity:{{ spot.radioDotOpacity }};"></div>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <div style="margin-top:18px;padding:16px;border-radius:18px;background:#F5C242;box-shadow:0 10px 22px rgba(197,142,20,.35);text-align:center;font-size:16px;font-weight:800;color:#5A3E0A;cursor:pointer;">Confirm location</div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 460, &quot;height&quot;: 880}}">
class Component extends DCLogic {
  state = {
    selectedId: 1,
    searchOpen: false,
    searchQuery: '',
    sheetOffset: 420,
    spots: [
      { id: 1, name: 'Mamak Corner \u2013 SS15', address: 'Jalan SS15/4, Subang Jaya', distance: '120m' },
      { id: 2, name: 'Mamak Corner \u2013 Sunway', address: 'Jalan Lagoon Selatan, Bandar Sunway', distance: '340m' },
      { id: 3, name: 'Mamak Corner \u2013 USJ 1', address: 'Persiaran Subang Permai, USJ', distance: '480m' },
    ],
  };

  componentDidMount() {
    this._playIntro();
  }

  _playIntro() {
    this.setState({ sheetOffset: 420 });
    clearTimeout(this._introTimer);
    this._introTimer = setTimeout(() => this.setState({ sheetOffset: 0 }), 60);
  }

  renderVals() {
    const sel = this.state.selectedId;
    const spots = this.state.spots.map((s) => {
      const on = s.id === sel;
      return {
        id: s.id,
        name: s.name,
        address: s.address,
        distance: s.distance,
        select: () => this.setState({ selectedId: s.id }),
        bg: on ? '#FBF0D7' : '#FFFDF8',
        border: on ? '#F5C242' : '#F0E6D4',
        iconBg: on ? '#F5C242' : '#F4E8D6',
        iconColor: on ? '#5A3E0A' : '#9C8A72',
        distColor: on ? '#B8860F' : '#B0A48D',
        radioBg: on ? '#F5C242' : '#FFFFFF',
        radioBorder: on ? '#F5C242' : '#E4D8C2',
        radioDotOpacity: on ? 1 : 0,
      };
    });

    return {
      spots,
      sheetOffset: this.state.sheetOffset,
      setSheet: (el) => { this._sheetEl = el; },
      replay: () => this._playIntro(),
      searchOpen: this.state.searchOpen,
      notSearchOpen: !this.state.searchOpen,
      searchQuery: this.state.searchQuery,
      openSearch: () => this.setState({ searchOpen: true }),
      closeSearch: () => this.setState({ searchOpen: false }),
      onSearchChange: (e) => this.setState({ searchQuery: e.target.value }),
      setSearchInput: (el) => { if (el && this.state.searchOpen) el.focus(); },
    };
  }
}

</script>
</body>
</html>

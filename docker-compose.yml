services:
  redis:
    image: redis:7-alpine
    container_name: receipt-drop-redis
    ports:
      # Override via REDIS_HOST_PORT in .env if 6379 is already taken on
      # your machine by an unrelated Redis — only affects host-side
      # `redis-cli` access; leaderboard-api always reaches this container
      # over the internal Docker network (redis://redis:6379), unaffected.
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    # Must match the redis Deployment's command in deploy/k8s/redis.yaml —
    # keep both in sync if either changes.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  leaderboard-api:
    build: ./services/leaderboard-api
    container_name: receipt-drop-leaderboard-api
    ports:
      - "8082:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:

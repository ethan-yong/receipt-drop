services:
  ocr-api:
    build: ./services/ocr-api
    container_name: receipt-drop-ocr-api-dev
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      OCR_LOG_LEVEL: ${OCR_LOG_LEVEL:-INFO}
    volumes:
      - ./services/ocr-api/ocr_api:/app/ocr_api
    command:
      - uvicorn
      - ocr_api.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --reload
      - --reload-dir
      - /app/ocr_api
    extra_hosts:
      - "host.docker.internal:host-gateway"

[project]
name = "ocr-api"
version = "0.2.0"
description = "Self-hosted receipt OCR (Tesseract + OpenCV deskew/contrast/binarize preprocessing)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  # pytesseract needs the native tesseract binary: the Dockerfile installs
  # tesseract-ocr via apt; Windows devs set TESSERACT_CMD to the exe path.
  "pytesseract>=0.3.13",
  # -headless: no GUI stubs, so the image needs no libgl1/libglib2.0-0.
  "opencv-python-headless>=4.9.0",
  "numpy>=1.26.0,<2.0.0",
  "pydantic>=2.10.0",
  # Outbound async call to the LLM gateway in ocr_api/receipt_understanding.py —
  # also used by FastAPI's TestClient in dev, hence still listed there too.
  "httpx>=0.28.0",
  # Insight curation graph (Phases 2+). Pin major version — the StateGraph /
  # reducer / Send API this migration depends on has broken across minors
  # historically, and this service has no lock file. langchain-core is an
  # explicit dep too: graph.py imports RunnableConfig directly, and a bare
  # langgraph install can leave it unresolved in some editable/.venv setups.
  "langgraph>=1.2.0,<2.0",
  "langchain-core>=0.3.0,<2.0",
]

[project.scripts]
ocr-api = "ocr_api.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pillow>=10.0.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocr_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ocr_api"]
